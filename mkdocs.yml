site_name: Django Guitar
site_description: Django ORM for your frontend
site_url: https://django-guitar.dev
repo_url: https://github.com/django-guitar/django-guitar
repo_name: django-guitar/django-guitar

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
    - API Reference: api-reference.md
    - Permission Patterns: permission-patterns.md
    - TypeScript Client: typescript-client.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/django-guitar/django-guitar
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/django-guitar/

extra_css:
  - stylesheets/extra.css

